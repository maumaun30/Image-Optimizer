name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            # The systemd units run from the Cloud Panel site root; set the DEPLOY_PATH
            # secret to that directory if it differs from this default.
            cd "${{ secrets.DEPLOY_PATH || '/var/www/image-optimizer' }}"

            # Pull latest code
            git pull origin main

            # Install/update Python dependencies
            source venv/bin/activate
            pip install -r requirements.txt

            # Run DB migrations
            alembic upgrade head

            # Reload services (zero-downtime for API)
            # The video worker finishes its current encode before stopping (Celery warm
            # shutdown); one cut off by systemd's stop timeout is redelivered and re-run.
            sudo systemctl restart imageopt-worker imageopt-video-worker imageopt-beat
            sudo systemctl reload-or-restart imageopt-api

            # Fail the deploy if any service didn't come back up
            for svc in imageopt-api imageopt-worker imageopt-video-worker imageopt-beat; do
              sudo systemctl is-active --quiet "$svc" || { echo "$svc: NOT RUNNING"; exit 1; }
              echo "$svc: OK"
            done
