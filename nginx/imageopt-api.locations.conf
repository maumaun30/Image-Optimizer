# Everything inside the API site's `server {}` except listen/server_name/ssl, which
# Cloud Panel manages. Install:
#   cp nginx/imageopt-api.locations.conf /etc/nginx/snippets/
# then in the site's vhost replace its own `location / {...}` block with:
#   include /etc/nginx/snippets/imageopt-api.locations.conf;

# Small by default; only the upload locations allow big bodies. Anything else
# (logout, unknown paths) has no business sending megabytes.
client_max_body_size 1m;
client_body_timeout  3600s;

gzip on;
gzip_types application/json text/plain;

add_header X-Content-Type-Options nosniff;
add_header X-Frame-Options DENY;

# This host sits behind Cloudflare: restore the visitor's IP for the rate limits
include /etc/nginx/snippets/cloudflare-realip.conf;
limit_req_status 429;

# Image and PDF uploads. Streamed, not buffered, so the app's sign-in check
# (UploadAuthMiddleware) rejects an anonymous upload before nginx has stored it.
# Body cap must cover 20 files * MAX_FILE_SIZE_MB.
location ~ ^/(images|pdf)/upload$ {
    limit_req zone=imageopt_upload burst=10 nodelay;
    client_max_body_size 1100m;
    proxy_request_buffering off;
    proxy_pass http://imageopt_api;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
    proxy_connect_timeout 10s;
}

# Video uploads normally go to the upload host (Cloudflare caps bodies at 100 MB),
# but small ones through here still work.
location /video/upload {
    limit_req zone=imageopt_video_upload burst=5 nodelay;
    client_max_body_size 100m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://imageopt_api;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_connect_timeout 10s;
}

# Downloads of processed videos can be large and slow
location /video/download {
    proxy_pass http://imageopt_api;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_connect_timeout 10s;
}

location / {
    proxy_pass http://imageopt_api;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
    proxy_connect_timeout 10s;
    # Stream FileResponse straight to the client
    proxy_buffering off;
}
