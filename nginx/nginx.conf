upstream imageopt_api {
    # Must match APP_PORT in .env — nginx cannot read the env file, so this is not
    # kept in sync automatically. A mismatch shows up as a 502 from every endpoint.
    server 127.0.0.1:8000;
    keepalive 32;
}

# Per-IP upload limits. Keyed on the real client IP — see cloudflare-realip.conf.
# Status polling and downloads are deliberately not limited.
limit_req_zone $binary_remote_addr zone=imageopt_upload:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=imageopt_video_upload:10m rate=6r/m;

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;

    # SSL — managed by Cloud Panel / Certbot
    ssl_certificate     /etc/ssl/certs/your-domain.com.crt;
    ssl_certificate_key /etc/ssl/private/your-domain.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Small by default; only the upload locations below allow big bodies. Anything
    # else (logout, unknown paths) has no business sending megabytes.
    client_max_body_size 1m;
    client_body_timeout  3600s;

    gzip on;
    gzip_types application/json text/plain;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    include /etc/nginx/snippets/cloudflare-realip.conf;
    limit_req_status 429;

    # Image and PDF uploads. Streamed, not buffered, so the app's sign-in check
    # (UploadAuthMiddleware) rejects an anonymous upload before nginx has stored it.
    # Body cap must cover 20 files * MAX_FILE_SIZE_MB.
    location ~ ^/(images|pdf)/upload$ {
        limit_req zone=imageopt_upload burst=10 nodelay;
        client_max_body_size 1100m;
        proxy_request_buffering off;
        proxy_pass http://imageopt_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # Multi-gigabyte uploads: stream the body straight to the app instead of
    # buffering the whole thing to disk first, and allow a long slow upload.
    location /video/upload {
        limit_req zone=imageopt_video_upload burst=5 nodelay;
        # Must cover MAX_VIDEO_SIZE_MB * MAX_VIDEO_FILES; raise both together
        client_max_body_size 10G;
        proxy_pass http://imageopt_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }

    # Downloads of processed videos can be large and slow too
    location /video/download {
        proxy_pass http://imageopt_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://imageopt_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;

        # Disable buffering so FileResponse streams directly to client
        proxy_buffering off;
    }
}
