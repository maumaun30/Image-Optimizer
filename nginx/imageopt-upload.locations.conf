# Everything inside the upload site's `server {}` except listen/server_name/ssl.
# This hostname is DNS-only (grey cloud) so multi-gigabyte video uploads bypass
# Cloudflare's 100 MB body cap. It serves video uploads and nothing else. Install:
#   cp nginx/imageopt-upload.locations.conf /etc/nginx/snippets/
# then in the site's vhost replace its own `location / {...}` block with:
#   include /etc/nginx/snippets/imageopt-upload.locations.conf;

client_max_body_size 1m;
client_body_timeout  3600s;

add_header X-Content-Type-Options nosniff;
add_header X-Frame-Options DENY;

# No cloudflare-realip include: clients connect directly, so $remote_addr is
# already their real IP (and a forged CF-Connecting-IP header is ignored).
limit_req_status 429;

# Multi-gigabyte uploads: streamed straight to the app, never buffered to disk, so
# the sign-in check rejects anonymous uploads before anything is stored.
location = /video/upload {
    limit_req zone=imageopt_video_upload burst=5 nodelay;
    # Must cover MAX_VIDEO_SIZE_MB * MAX_VIDEO_FILES; raise both together
    client_max_body_size 10G;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://imageopt_api;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_connect_timeout 10s;
}

# Anything else on this host is not ours to serve
location / {
    return 404;
}
