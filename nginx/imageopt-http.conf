# http-level pieces shared by both sites. Install ONCE:
#   cp nginx/imageopt-http.conf /etc/nginx/conf.d/imageopt.conf
# (/etc/nginx/nginx.conf must `include /etc/nginx/conf.d/*.conf;` inside `http {}` —
# the stock Debian/Ubuntu config does.) Defining these in a site file instead would
# break the second site with a "duplicate zone" error.

upstream imageopt_api {
    # Must match APP_PORT in the API's .env — nginx cannot read the env file, so this
    # is not kept in sync automatically. A mismatch shows up as a 502 everywhere.
    server 127.0.0.1:8090;
    keepalive 32;
}

# Per-IP upload limits, shared by the API and upload hosts so a client can't double
# its allowance by switching hostnames. Keyed on the real client IP: behind
# Cloudflare that needs cloudflare-realip.conf. Status polling and downloads are
# deliberately not limited.
# CORS preflights (OPTIONS) get an empty key, which nginx never limits — otherwise
# every video upload (XHR with a progress listener ⇒ preflight) would count twice.
map $request_method $imageopt_limit_key {
    OPTIONS "";
    default $binary_remote_addr;
}

limit_req_zone $imageopt_limit_key zone=imageopt_upload:10m rate=20r/m;
limit_req_zone $imageopt_limit_key zone=imageopt_video_upload:10m rate=6r/m;
